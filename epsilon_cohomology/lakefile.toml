name = "epsilon_cohomology"
version = "0.1.0"
keywords = ["math", "cohomology", "topology"]
description = "Formalization of epsilon-cohomology with fractal scaling properties"

[package]
license = "Apache-2.0"
authors = ["Your Name"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.missingDocs = true  # Enable documentation warnings

[[require]]
name = "mathlib"
scope = "leanprover-community" 
rev = "v4.33.0"
git = "https://github.com/leanprover-community/mathlib4.git"

[[lean_lib]]
name = "EpsilonCohomology"
globOptions = {
  exclude = ["Test/**"]  # Exclude test files from main build
}

# Enable more parallel workers for faster builds
[lean.workers]
server = 4
workers = 4

# Cache build artifacts for faster rebuilds
[lean.cache]
enabled = true
path = ".lake/build_cache"

# Add development dependencies
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"
git = "https://github.com/leanprover-community/mathlib4.git"
doc = "https://leanprover-community.github.io/mathlib4_docs/"

[[require]]
name = "proofwidgets"
rev = "v0.0.1"
git = "https://github.com/leanprover-community/ProofWidgets4.git"

# Test target configuration
[[lean_lib]]
name = "Tests"
path = "Test"
globOptions = {
  include = ["**/*.lean"]
}

# Documentation target
[lean.doc]
root = "EpsilonCohomology"
