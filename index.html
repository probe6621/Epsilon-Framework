  <style>

      letter-spacing: -0.5px;
    }

    .tagline { color: var(--subtext); font-size: 1.15rem; max-width: 780px; margin: 0 auto; }

      border-radius: 6px;

      margin: 10px 10px 0 0;

    .btn:hover { opacity: .9; }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
